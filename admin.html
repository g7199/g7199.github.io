<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Edit · Research Bento</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✎</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Karla:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
  <header class="bar">
    <a class="home" href="./">← View site</a>
    <h1>Edit your bento</h1>
    <span class="status" id="status" role="status" aria-live="polite"></span>
    <button class="ghost" id="lock" hidden>Lock</button>
    <button class="primary" id="save" hidden disabled>Save</button>
  </header>

  <main class="wrap">
    <!-- locked: set up or unlock -->
    <section class="gate" id="gate"></section>

    <!-- unlocked: the editor -->
    <section class="editor" id="editor" hidden>
      <nav class="tabs" id="tabs" aria-label="Sections"></nav>
      <div class="panel" id="panel"></div>
    </section>
  </main>

  <input type="file" id="filePicker" accept="image/*" multiple hidden />
  <input type="file" id="pdfPicker" accept="application/pdf,.pdf" hidden />
  <script src="admin.js"></script>
</body>
</html>
