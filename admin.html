<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Edit site · Geonwoo Bang</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%23a8391c'/%3E%3Ctext x='32' y='46' text-anchor='middle' font-family='Georgia%2Cserif' font-size='42' font-weight='700' fill='%23fbfaf7'%3EG%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400..700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
  <header class="bar">
    <a class="home" href="./">← View site</a>
    <h1>Edit site</h1>
    <span class="status" id="status" role="status" aria-live="polite"></span>
    <button class="ghost" id="lock" hidden>Lock</button>
    <button class="primary" id="save" hidden disabled>Save</button>
  </header>

  <main class="wrap">
    <!-- locked: set up or unlock -->
    <section class="gate" id="gate"></section>

    <!-- unlocked: the editor -->
    <section class="editor" id="editor" hidden>
      <nav class="tabs" id="tabs" aria-label="Sections"></nav>
      <div class="panel" id="panel"></div>
    </section>
  </main>

  <input type="file" id="filePicker" accept="image/*" multiple hidden />
  <input type="file" id="pdfPicker" accept="application/pdf,.pdf" hidden />
  <script src="admin.js"></script>
</body>
</html>
