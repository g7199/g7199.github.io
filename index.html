<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Research Bento</title>
  <meta name="description" content="A research portfolio, packed like a lunchbox" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍱</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Courier+Prime:wght@400;700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Karla:wght@300;400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <header class="masthead">
      <p class="kicker">Today's Bento</p>
      <h1 id="name"></h1>
      <p class="hint"><span>tap a dish, a flag, or anything on the table</span><a id="cv-link" class="cv-link" href="#" target="_blank" rel="noopener" hidden>Download CV (PDF)</a></p>
    </header>

    <!-- One illustrated table: dishes · side label (about) · receipt (news) · chopsticks (contact) -->
    <section class="scene" id="scene" aria-label="A lunchbox on a table"></section>

    <footer class="foot" id="foot"></footer>
  </main>

  <dialog class="sheet" id="sheet" aria-labelledby="sheet-title">
    <div class="sheet-inner">
      <header class="sheet-head">
        <span class="sheet-art" id="sheet-art"></span>
        <div>
          <p class="sheet-no" id="sheet-no"></p>
          <h2 id="sheet-title"></h2>
        </div>
        <button class="close" id="sheet-close" aria-label="Close">Close ✕</button>
      </header>
      <div class="sheet-body" id="sheet-body" tabindex="-1"></div>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="bento.js"></script>
  <script src="main.js"></script>
</body>
</html>
